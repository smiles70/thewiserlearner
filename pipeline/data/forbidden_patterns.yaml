# Forbidden surface-form patterns (case-insensitive substring match).
# Source of truth for both `pipeline/audit.py` and `contract/audit-rubric.md`.
# Any change here must be mirrored in the rubric within the same PR.
#
# Each entry maps a contract clause to a list of forbidden substrings.

