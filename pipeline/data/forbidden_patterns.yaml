  - "for seniors"
  - "for the elderly"
  - "elderly people"
  - "despite your age"
  - "back in your day"
  - "kids these days"
  - "tech-savvy youngsters"
  - "old-fashioned"
  - "even your grandparents"
  - "old timer"

C-4.2:  # Deficit framing
  - "if you struggle with"
  - "for those who find it hard"
  - "if you're nervous about"
  - "if computers scare you"
  - "if technology intimidates"

